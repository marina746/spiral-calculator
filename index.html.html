<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Калькулятор Кодов Судьбы</title>
    <style>
        body {
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background-color: #f4f7f6;
            color: #333;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }
        .calculator-card {
            background: #ffffff;
            padding: 30px;
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.05);
            max-width: 450px;
            width: 100%;
            box-sizing: border-box;
        }
        h2 {
            margin-top: 0;
            color: #2c3e50;
            text-align: center;
            font-size: 24px;
            margin-bottom: 25px;
        }
        .form-group {
            margin-bottom: 20px;
        }
        label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: #4a5568;
            font-size: 14px;
        }
        input[type="date"] {
            width: 100%;
            padding: 12px;
            border: 2px solid #e2e8f0;
            border-radius: 8px;
            font-size: 16px;
            box-sizing: border-box;
            outline: none;
            transition: border-color 0.2s;
        }
        input[type="date"]:focus {
            border-color: #4f46e5;
        }
        button {
            width: 100%;
            background-color: #4f46e5;
            color: white;
            border: none;
            padding: 14px;
            font-size: 16px;
            font-weight: 600;
            border-radius: 8px;
            cursor: pointer;
            transition: background-color 0.2s;
        }
        button:hover {
            background-color: #4338ca;
        }
        .results-box {
            margin-top: 25px;
            border-top: 2px solid #edf2f7;
            padding-top: 20px;
            display: none;
        }
        .result-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #f8fafc;
            padding: 12px 16px;
            border-radius: 8px;
            margin-bottom: 10px;
            border-left: 4px solid #4f46e5;
        }
        .result-title {
            font-weight: 500;
            color: #64748b;
            font-size: 14px;
        }
        .result-value {
            font-weight: 700;
            color: #1e293b;
            font-size: 16px;
            text-align: right;
        }
    </style>
</head>
<body>

<div class="calculator-card">
    <h2>Коды Судьбы по 22 Арканам</h2>
    
    <div class="form-group">
        <label for="birthdate">Выберите дату рождения:</label>
        <input type="date" id="birthdate" required>
    </div>
    
    <button onclick="handleCalculation()">Рассчитать коды</button>

    <div class="results-box" id="resultsBox">
        <div class="result-item">
            <span class="result-title">КР (Код рождения):</span>
            <span class="result-value" id="krValue">-</span>
        </div>
        <div class="result-item">
            <span class="result-title">КС1 (Код судьбы 1):</span>
            <span class="result-value" id="ks1Value">-</span>
        </div>
        <div class="result-item">
            <span class="result-title">КС2 (Код судьбы 2):</span>
            <span class="result-value" id="ks2Value">-</span>
        </div>
    </div>
</div>

<script>
    const arcanes = {
        1: "Маг", 2: "Верховная Жрица", 3: "Императрица", 4: "Император", 5: "Иерофант",
        6: "Влюбленные", 7: "Колесница", 8: "Справедливость", 9: "Отшельник", 10: "Колесо Фортуны",
        11: "Сила", 12: "Повешенный", 13: "Смерть", 14: "Умеренность", 15: "Дьявол",
        16: "Башня", 17: "Звезда", 18: "Луна", 19: "Солнце", 20: "Суд", 21: "Мир", 22: "Шут"
    };

    function reduceBy22(num) {
        let val = parseInt(num);
        if (isNaN(val) || val <= 0) return 22;
        while (val > 22) {
            val -= 22;
        }
        return val;
    }

    function sumDigits(str) {
        let total = 0;
        for (let i = 0; i < str.length; i++) {
            let digit = parseInt(str[i]);
            if (!isNaN(digit)) {
                total += digit;
            }
        }
        return total;
    }

    function handleCalculation() {
        try {
            const dateInput = document.getElementById('birthdate').value;
            
            if (!dateInput) {
                alert('Пожалуйста, выберите дату рождения');
                return;
            }

            // Корректно разбиваем дату из формата ГГГГ-ММ-ДД
            const dateParts = dateInput.split('-');
            if (dateParts.length !== 3) {
                alert('Ошибка формата даты');
                return;
            }

            const yearStr = dateParts[0];
            const monthStr = dateParts[1];
            const dayStr = dateParts[2];
            
            const dayNum = parseInt(dayStr);
            const monthNum = parseInt(monthStr);

            // 1. Расчет КР
            const KR = reduceBy22(dayNum);

            // 2. Расчет КС1
            const allDigitsSum = sumDigits(dayStr + monthStr + yearStr);
            const KS1 = reduceBy22(allDigitsSum);

            // 3. Расчет КС2
            const dayReduced = reduceBy22(dayNum);
            const monthReduced = reduceBy22(monthNum);
            const yearDigitsSum = sumDigits(yearStr);
            const yearReduced = reduceBy22(yearDigitsSum);

            const totalKS2Sum = dayReduced + monthReduced + yearReduced;
            const KS2 = reduceBy22(totalKS2Sum);

            // Отображение результатов на экране
            document.getElementById('krValue').innerText = KR + " — " + (arcanes[KR] || "");
            document.getElementById('ks1Value').innerText = KS1 + " — " + (arcanes[KS1] || "");
            document.getElementById('ks2Value').innerText = KS2 + " — " + (arcanes[KS2] || "");

            // Показываем скрытый блок результатов
            document.getElementById('resultsBox').style.display = 'block';
        } catch (error) {
            alert('Произошла ошибка при расчете: ' + error.message);
        }
    }
</script>

</body>
</html>
